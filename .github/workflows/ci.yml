# CI for ProfileForge (specs/010-github-actions-ci).
#
# One job on ubuntu-latest: lint → typecheck → build → unit/integration → e2e →
# keyless benchmark, cheapest first so a broken commit fails fast. The Vitest
# suite runs against a Postgres 16 service container (same image/credentials as
# compose `db`); the e2e suite provisions its own isolated database via the
# existing `npm run test:e2e` script (compose `e2e-db` on 5434 — see
# playwright.config.ts). The keyless benchmark is a regression tripwire over the
# deterministic pipeline (matching, selection, render verification) — the
# harness self-provisions `profileforge_benchmark` on the service container and
# needs no AI key (spec 009 Scenario A). All commands are the project's existing
# npm scripts, invoked unchanged. `npm ci` triggers `prisma generate` via the
# package.json postinstall hook — src/generated/ is gitignored, so the client
# must be regenerated on every fresh checkout.
name: CI

on:
  push:
  pull_request:

# Superseded runs for the same ref are cancelled to conserve free-tier minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    # Same engine and credentials as docker-compose.yml's `db` service.
    # The Vitest global setup (tests/global-setup.ts) derives `profileforge_test`
    # from DATABASE_URL and runs `prisma migrate deploy` against it; Prisma
    # creates the database if missing. The e2e scripts read DATABASE_URL only
    # as the MAIN database for a safety guard and default their own
    # E2E_DATABASE_URL to 5434, so this export never leaks into the e2e path.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: profileforge
          POSTGRES_PASSWORD: profileforge
          POSTGRES_DB: profileforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://profileforge:profileforge@localhost:5432/profileforge
      NEXT_TELEMETRY_DISABLED: "1"
      # Free OpenRouter models for the keyless benchmark replay. Keyless mode
      # never calls the network — the model id only feeds the transcript input
      # hash, so this MUST match the committed transcripts' recording run.
      # When a free model is retired upstream (minimax-m3.1-flash:free was, in
      # Oct 2026), re-record with `npm run benchmark -- --record` using the new
      # models and update this line in the same commit.
      BENCHMARK_FREE_MODELS: extractRequirements=nvidia/nemotron-3.5-super-vl:free,semanticProposals=nvidia/nemotron-3.5-super-vl:free,generateTailoredCV=nvidia/nemotron-3.5-super-vl:free,generateCoverLetter=nvidia/nemotron-3.5-super-vl:free

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # LayoutProps and the route types come from Next's generated types;
        # typegen produces them without a full build (docs: cli/next.md).
        run: npx next typegen && npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e
        timeout-minutes: 20

      # Keyless replay resolves the model per task exactly as --record did (the
      # transcript input hash includes it), so the mapping must match the
      # committed transcripts' recording run.
      - name: Keyless benchmark (deterministic regression gate)
        run: >-
          npm run benchmark -- --keyless
          --models "$BENCHMARK_FREE_MODELS"
        timeout-minutes: 5

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
